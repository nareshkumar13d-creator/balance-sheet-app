ext (blank = leave space)<\/label><input data-m=\"sg\" value=\"sd/-\"><\/div>\n<div><label>Firm signatory designation<\/label><input data-m=\"sg1\" value=\"Prop.\"><\/div>\n<\/div><\/details>\n<div class=\"tabs\" id=\"tabs\"><\/div>\n<div id=\"bs\" class=\"pn on\"><\/div><div id=\"ie\" class=\"pn\"><\/div><div id=\"sc\" class=\"pn\"><\/div><div id=\"dp\" class=\"pn\"><\/div><div id=\"qt\" class=\"pn\"><\/div>\n<div class=\"bar\"><input id=\"fn\" placeholder=\"File name (optional)\" aria-label=\"File name\" style=\"width:230px\"><button id=\"xl\">Export to Excel (.xlsx)<\/button><button class=\"o\" id=\"sv\">Save data<\/button><button class=\"o\" id=\"ld\">Load data<\/button><button class=\"o\" id=\"imp\">Import Excel (select both years together)<\/button><button class=\"o\" id=\"cla\">Clear amounts<\/button><button class=\"o\" id=\"clr\">Reset all<\/button><input type=\"file\" id=\"ldf\" accept=\".json,.bsdata\" hidden><input type=\"file\" id=\"impf\" accept=\".xlsx,.xlsm,.xls,.xlsb,.xltx,.xltm,.xlt,.rar,.zip\" multiple hidden><\/div>\n<p style=\"color:var(--mut);font-size:12px\">Enter amounts only in the Schedules and Depreciation tabs. The Balance Sheet and Profit &amp; Loss are built automatically from the schedules, and the Excel export carries live cross-sheet formulas. Type a file name before exporting if you want to change it. \"Import Excel\" reloads a file exported from this tool (it restores the data saved at export time; edits made later inside Excel are not read back).<\/p>\n<\/div>\n<script>\nconst M={firm:'',addr:'',d1:'31.03.2026',d0:'31.03.2025',show:'Y',caFirm:'',caType:'Chartered Accountants',caName:'',caDesig:'Partner',caNo:'',caUdin:'',caFrn:'',place:'',dsign:'',sg:'sd/-',sg1:'Prop.'};\nconst G=(id,h,s,r)=>({id,h,s,r:r.map(x=>typeof x==='string'?{n:x,v:[0,0]}:{n:x.n,k:x.k,a:x.a,v:[0,0]})});\nconst T=(n,t,g)=>({n,t,g});\nlet ACC=0;\nconst mkAcc=(name,pct)=>{const a={name,pct},k=++ACC,g=[G('1a'+k,'Opening Balance',1,['Opening Balance']),G('1b'+k,'A ><button class=\"o\" id=\"sv\">Save data<\/button><button class=\"o\" id=\"ld\">Load data<\/button><button class=\"o\" id=\"imp\">Import Excel<\/button><button class=\"o\" id=\"cla\">Clear amounts<\/button><button class=\"o\" id=\"clr\">Reset all<\/button><input type=\"file\" id=\"ldf\" accept=\".json,.bsdata\" hidden><input type=\"file\" id=\"impf\" accept=\".xlsx,.xlsm,.xls,.xlsb,.xltx,.xltm,.xlt\" hidden><\/div>\n<p style=\"color:var(--mut);font-size:12px\">Enter amounts only in the Schedules and Depreciation tabs. The Balance Sheet and Profit &amp; Loss are built automatically from the schedules, and the Excel export carries live cross-sheet formulas. Type a file name before exporting if you want to change it. \"Import Excel\" reloads a file exported from this tool (it restores the data saved at export time; edits made later inside Excel are not read back).<\/p>\n<\/div>\n<script>\n(function(){function box(msg,btns){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';const c=document.createElement('div');c.style.cssText='background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:420px;width:90%';const p=document.createElement('p');p.style.margin='0 0 14px';p.textContent=msg;const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;justify-content:flex-end';btns.forEach(([t,fn,o])=>{const b=document.createElement('button');b.textContent=t;if(o)b.className='o';b.onclick=()=>{ov.remove();if(fn)fn()};r.appendChild(b)});c.append(p,r);ov.appendChild(c);document.body.appendChild(ov);r.lastChild.focus()}\nwindow.ask=(m,y)=>box(m,[['Cancel',0,1],['OK',y]]);window.alert=m=>box(String(m),[['OK']])})();\nconst M={mode:'B',firm:'',addr:'',d1:'31.03.2026',d0:'31.03.2025',show:'Y',caFirm:'',caType:'Chartered Accountants',caName:'',caDesig:'Partner',caNo:'',caUdin:'',caFrn:'',place:'',dsi
