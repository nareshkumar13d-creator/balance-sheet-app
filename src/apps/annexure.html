<!DOCTYPE html>
<html lang="en"><head><!--@include shared/dialogs.html-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Sheet</title>
<!--@libs-->
<!--@include shared/xlsx-pagesetup.html-->
<style>
/*@include shared/base.css*/
/* annexure: small differences from the other formats */
.tabs,.bar{gap:6px;margin:10px 0}td.nt{width:60px}
</style></head><body><div class="w">
<div id="fyl" style="font-size:14px;font-weight:600;color:var(--acc);margin:0 0 2px"></div><h1>Balance Sheet</h1>
<div class="meta">
<div><label>Firm Name</label><input data-m="firm"></div>
<div><label>Address</label><input data-m="addr"></div>
<div><label>Balance sheet date (dd.mm.yyyy)</label><input data-m="d" value="31.03.2026" maxlength="10" inputmode="numeric"></div>
<div><label>Assessment Year</label><input data-m="ay" value="2026-27"></div>
<div><label>Business type</label><select data-m="mode"><option value="B">Business / Trading (Sale, Purchase, Stock)</option><option value="P">Profession – 44ADA</option><option value="A">Business – 44AD (Turnover)</option><option value="I">Income &amp; Expenditure</option></select></div>
</div>
<!--@include shared/auditor-form.html-->
<div class="tabs" id="tabs"></div>
<div id="in" class="pn on"></div><div id="bs" class="pn"></div><div id="pl" class="pn"></div><div id="cap" class="pn"></div>
<div class="bar"><input id="fn" placeholder="File name (optional)" aria-label="File name" style="width:230px"><button id="xl">Export to Excel (.xlsx)</button><button class="o" id="sv">Save data</button><button class="o" id="ld">Load data</button><button class="o" id="imp">Import Excel</button><input type="file" id="ldf" accept=".json,.bsdata" hidden><button class="o" id="ca">Clear amounts</button><button class="o" id="rs">Reset all</button><input type="file" id="impf" accept=".xlsx,.xlsm,.xls,.xlsb,.xltx,.xltm,.xlt" hidden></div>
<p style="color:var(--mut);font-size:12px">Enter data only in the "Enter Data" tab. Balance Sheet, Trading &amp; P&amp;L, Capital Account, Annexures B–H and the fixed asset account are built automatically. Capital closing balance = Opening + Additions + Net Profit − Drawings.</p>
</div>
<script>
const N=x=>+x||0,esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),
fmt=n=>N(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const SEC=[['sales','Sales'],['pur','Purchase'],['exp','Expenses (Bank Charges, Shop Exp., Audit Fees ...)'],['oi','Other Income (Interest, Discount ...)'],['cadd','Capital A/c – Additions (Bank, Cash, Interest ...)'],['cdr','Capital A/c – Drawings / Deductions'],
['B','Secured Loans','Secured Loan'],['C','Unsecured Loans','Unsecured Loan'],['D','Sundry Creditors','Sundry Creditors'],['E','Other Provisions','Other Provisions'],['F','Loans & Advances','Loan & Advances'],['G','Sundry Debtors','Sundry Debtors'],['H','Duties & Taxes','Duties & Taxes'],
['cash','Cash & Bank Balances (Cash in Hand, Bank ...)','Cash & Bank Balances'],['dep','Deposits / Security']];
const row=n=>({n:n||'',v:''}),fr=()=>({n:'',r:'',o:'',a1:'',a2:'',d:''});
const PR={P:['Gross Receipts from Profession – summary',[['Presumptive Income u/s 44ADA @ 50%',.5]]],A:['Business Turnover – summary',[['Presumptive Income u/s 44AD @ 8%',.08],['Presumptive Income u/s 44AD @ 6% (digital receipts)',.06]]]};
const UNITS=[['KGS','Kilograms'],['QTL','Quintal'],['PCS','Pieces'],['NOS','Numbers'],['MTS','Metric Tons'],['TON','Tonnes'],['LTR','Litres'],['BAG','Bags'],['BOX','Box'],['MTR','Metres'],['GMS','Grams'],['DOZ','Dozens'],['PAC','Packs'],['PRS','Pairs'],['SET','Sets'],['UNT','Units'],['BAL','Bale'],['BDL','Bundles'],['BKL','Buckles'],['BOU','Billions of Units'],['BTL','Bottles'],['BUN','Bunches'],['CAN','Cans'],['CBM','Cubic Meters'],['CCM','Cubic Centimeters'],['CMS','Centimeters'],['CTN','Cartons'],['DRM','Drums'],['GGR','Great Gross'],['GRS','Gross'],['GYD','Gross Yards'],['KLR','Kilolitre'],['KME','Kilometre'],['MLT','Millilitre'],['ROL','Rolls'],['SQF','Square Feet'],['SQM','Square Meters'],['SQY','Square Yards'],['TBS','Tablets'],['TGM','Ten Gross'],['THD','Thousands'],['TUB','Tubes'],['UGS','US Gallons'],['YDS','Yards'],['OTH','Others']];
const unitOpts=u=>'<option value="">Unit</option>'+UNITS.map(([c,n])=>`<option value="${c}"${c===u?' selected':''}>${c} – ${n}</option>`).join('');
const fmtQ=n=>(Math.round(n*1000)/1000).toLocaleString('en-IN',{maximumFractionDigits:3});
const qs=(q,u)=>N(q)?` (${fmtQ(N(q))}${u?' '+u:''})`:'';
const qtRows=()=>D.tb.filter(b=>(N(b.os)&&N(b.osq))||(N(b.pur)&&N(b.purq))||(N(b.sale)&&N(b.saleq))||(N(b.cs)&&N(b.csq))).map(b=>{const o=N(b.os)?N(b.osq):0,p=N(b.pur)?N(b.purq):0,sl=N(b.sale)?N(b.saleq):0,c=N(b.cs)?N(b.csq):0;return{name:b.n||'Trading',u:b.u||'',o,p,s:sl,c,sh:Math.round((o+p-sl-c)*1000)/1000}});
const fq=v=>v<0?'('+fmtQ(-v)+')':fmtQ(v);
const qtHtml=()=>{if(D.mode!=='B')return'';const Q=qtRows();if(!Q.length)return'';
 return `<div class="card"><div class="c">${esc(D.firm)}</div><div class="c">Quantitative Details for the year ending on ${esc(D.d)}</div><table style="min-width:700px"><tr><th>Block / Item</th><th>Unit</th><th class="n">Opening Stock</th><th class="n">Purchases</th><th class="n">Sales</th><th class="n">Closing Stock</th><th class="n">Shortage / (Excess)</th></tr>${Q.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.u||'—')}</td><td class="n">${fmtQ(x.o)}</td><td class="n">${fmtQ(x.p)}</td><td class="n">${fmtQ(x.s)}</td><td class="n">${fmtQ(x.c)}</td><td class="n">${fq(x.sh)}</td></tr>`).join('')}</table></div><p style="color:var(--mut);font-size:12px">Shortage / (Excess) = Opening Stock + Purchases − Sales − Closing Stock. Positive = shortage, in brackets = excess.</p>`};
const tb0=()=>({n:'',os:'',pur:'',sale:'',cs:'',osq:'',purq:'',saleq:'',csq:'',u:''});
const DEF={sales:['Sale 1','Sale 2'],pur:['Purchase 1','Purchase 2'],exp:['Accounting Fees','Bank Exp.','Bank Interest','Travelling Exp.','Insurance Premium','Interest','Interest On Vehicle Loan','Labour & Wages','Professional Fee','Salary','Diesel','Processing Fees','Misc. Shop Exp.','Staff Welfare','Repair & Maintenance','Other Exp.'],oi:['Interest Received','Labour Received'],cadd:['Cash Introduced','Bank Introduced','Interest'],cdr:['Drawings','Income Tax Paid','Insurance Premium'],B:['Bank OD Limit','Term Loan'],C:['Party 1','Party 2','Party 3'],D:['Party 1','Party 2','Party 3'],E:['TDS Payable','Salary Payable','GST'],F:['Advance To Farmers','Security Deposits','Party 1'],G:['Party 1','Party 2','Party 3'],H:['TDS','GST'],cash:['Bank A/c 1','Bank A/c 2','Cheque In Hand','Cash In Hand'],dep:['Security Deposit 1','Security Deposit 2']};
const mkc=pct=>({prop:'',ob:'',pct,add:DEF.cadd.map(n=>row(n)),dr:DEF.cdr.map(n=>row(n))});
const migr=o=>{const d=migSig(Object.assign(mk(),o));if(!Array.isArray(o.caps)){const c=mkc(100);c.prop=o.prop||'';c.ob=o.ob||'';if(o.L&&o.L.cadd)c.add=o.L.cadd;if(o.L&&o.L.cdr)c.dr=o.L.cdr;d.caps=[c]}return d};
const mk=()=>({tb:[tb0()],mode:'B',firm:'',addr:'',d:'31.03.2026',ay:'2026-27',caps:[mkc(100)],os:'',cs:'',
 L:Object.fromEntries(SEC.map(([k])=>[k,(DEF[k]||['','','']).map(n=>row(n))])),fa:[fr()],xs:[],xc:[],show:'Y',caFirm:'',caType:'Chartered Accountants',caName:'',caDesig:'Partner',caNo:'',caUdin:'',caFrn:'',place:'',dsign:'',sg:'sd/-',sg1:'Prop.',logo:''});
let D=mk();
const xsd=x=>x.rows.reduce((t,r)=>t+N(r.v),0),xrow=()=>({n:'',v:''});
const xside=x=>x.u==='A'||x.u==='L'?x.u:((D.xc.find(c=>c.id===x.u)||{}).side||'L');
const xsum=side=>D.xs.filter(x=>xside(x)===side).reduce((t,x)=>t+xsd(x),0);
/*@include shared/sig.js X=D*/
const caHtml=()=>sigHtml();
const dpc=d=>{const b=N(d.o)+N(d.a1)+N(d.a2)-N(d.d),p=Math.round((N(d.o)+N(d.a1)-N(d.d))*N(d.r)/100+N(d.a2)*N(d.r)/200);return{b,p,c:b-p}};
const sum=k=>D.L[k].reduce((t,x)=>t+N(x.v),0);
const pick=(k,pre)=>D.L[k].filter(x=>N(x.v)).map(x=>[pre+(x.n||''),N(x.v)]);
function C(){const fa=D.fa.filter(d=>N(d.o)||N(d.a1)||N(d.a2)).map(d=>({d,...dpc(d)})),dep=fa.reduce((t,x)=>t+x.p,0),
 T0=D.mode==='B',cs=T0?D.tb.reduce((t,b)=>t+N(b.cs),0):0,gp=T0?D.tb.reduce((t,b)=>t+N(b.sale)+N(b.cs)-N(b.os)-N(b.pur),0):0,np=(T0?gp:sum('sales'))+sum('oi')-sum('exp')-dep,
 cps=D.caps.map(c=>{const sh=np*N(c.pct)/100;return{c,sh,cl:N(c.ob)+c.add.reduce((t,x)=>t+N(x.v),0)+sh-c.dr.reduce((t,x)=>t+N(x.v),0)}}),cl=cps.reduce((t,x)=>t+x.cl,0),tl=cl+sum('B')+sum('C')+sum('D')+sum('E')+xsum('L'),
 ta=sum('F')+sum('G')+cs+sum('cash')+sum('H')+fa.reduce((t,x)=>t+x.c,0)+sum('dep')+xsum('A');
 return{fa,dep,gp,np,cl,cps,tl,ta,T0,cs}}
/* Annexure letters: Capital A..; then Liabilities (Secured, Unsecured, Creditors, Provisions, own schedules); then Assets, in Balance Sheet order */
function annexOrder(o){const NC=D.caps.length,SK=o.T0&&o.cs?1:0,XN=D.xs.filter(x=>xsd(x)),AN=SEC.filter(s=>s[2]&&sum(s[0])),
 an=ks=>ks.map(k=>AN.find(s=>s[0]===k)).filter(Boolean).map(s=>({t:'an',k:s[0],h:s[2]})),
 xo=side=>[...XN.filter(x=>x.u===side),...D.xc.filter(c=>c.side===side).flatMap(c=>XN.filter(x=>x.u===c.id))].map(x=>({t:'x',x})),
 ORD=[...an(['B','C','D','E']),...xo('L'),...an(['F','G']),...(SK?[{t:'stk'}]:[]),...an(['cash','H']),...xo('A')],LT={},XL={};
 ORD.forEach((a,i)=>{const c=String.fromCharCode(65+NC+i);if(a.t==='stk')LT.STK=c;else if(a.t==='an')LT[a.k]=c;else XL[a.x.id]=c});
 return{ORD,LT,XL,XN,SK}}
const tf=(L,R)=>{const n=Math.max(L.length,R.length),rows=[];
 for(let i=0;i<n;i++){const a=L[i]||['',null],b=R[i]||['',null];rows.push([a[0],a[1],b[0],b[1]])}
 const s=x=>x.reduce((t,y)=>t+N(y[1]),0);rows.push(['Total',s(L),'Total',s(R),1]);return rows};
function blocks(){const o=C(),dt=D.d,NC=D.caps.length,{ORD,LT,XL,XN,SK}=annexOrder(o),sg=(t,k,v)=>LT[k]?[[t,null],["(As per Annexure '"+LT[k]+"')",v??sum(k)]]:[],T=[D.firm,D.addr],H=['PARTICULARS','AMOUNT(Rs)','PARTICULARS','AMOUNT(Rs)'],gl=o.gp<0,
 grp=(t,r)=>r.length?[[t,null],...r]:[];
 const xg=x=>[[x.n||'Schedule',null],["(As per Annexure '"+XL[x.id]+"')",xsd(x)]],
 xblock=side=>[...XN.filter(x=>x.u===side).flatMap(xg),...D.xc.filter(c=>c.side===side).flatMap(c=>{const m=XN.filter(x=>x.u===c.id);return m.length?[[c.n+':',null],...m.flatMap(xg)]:[]})];
 const bsL=[['Capital Account:',null],...(NC>1?o.cps.map((x,i)=>[(x.c.prop||'Partner '+(i+1))+" (As per Annexure '"+String.fromCharCode(65+i)+"')",x.cl]):[["(As per Annexure 'A')",o.cl]]),...sg('Secured Loans','B'),...sg('Unsecured Loans','C'),...sg('Sundry Creditors','D'),...sg('Other Provisions','E'),...xblock('L')],
 bsR=[...sg('Loans & Advances','F'),...sg('Sundry Debtors','G'),...sg('Closing Stock','STK',o.cs),
  ...sg('Cash & Bank Balances','cash'),...sg('Duties & Taxes','H'),
  ...grp('Fixed Assets',o.fa.map(x=>[x.d.n||'Fixed Asset',x.c])),...grp('Deposits',pick('dep','')),...xblock('A')];
 const bs=[{t:[...T,'BALANCE SHEET AS AT '+dt],h:['LIABILITIES','AMOUNT(Rs)','ASSETS','AMOUNT(Rs)'],rows:tf(bsL,bsR)}];
 const pln=[{t:[...T,({P:'PROFIT & LOSS ACCOUNT',A:'PROFIT & LOSS ACCOUNT',I:'INCOME & EXPENDITURE ACCOUNT'}[D.mode])+' FOR THE YEAR ENDING ON '+dt],h:H,rows:tf([...pick('exp','To '),...(o.dep?[['To Depreciation',o.dep]]:[]),...(o.np>=0?[["To Net Profit Transfer to Prop's Cap. A/c",o.np]]:[])],[...pick('sales','By Gross Receipts – '),...pick('oi','By '),...(o.np<0?[["By Net Loss Transfer to Prop's Cap. A/c",-o.np]]:[])])}];
 if(PR[D.mode]){const g=sum('sales');pln.push({t:[PR[D.mode][0]],w:2,h:['Particulars','Amount'],rows:[['Gross Receipts / Turnover',g],['Net Profit as per Profit & Loss A/c',o.np],['Net Profit as % of receipts',g?Math.round(o.np/g*10000)/100:0],...PR[D.mode][1].map(([l,k])=>[l,g*k])]})}
 const tbs=D.tb.filter(b=>N(b.os)||N(b.pur)||N(b.sale)||N(b.cs)),TL='TRADING & PROFIT & LOSS ACCOUNT FOR THE YEAR ENDING ON '+dt,
 trb=(tbs.length?tbs:[D.tb[0]]).map((b,i)=>{const g=N(b.sale)+N(b.cs)-N(b.os)-N(b.pur);return{t:[...(i?[]:[...T,TL]),(b.n||'Trading'+(tbs.length>1?' '+(i+1):''))+' A/c :-'],h:H,rows:tf([['To Opening Stock'+(N(b.os)?qs(b.osq,b.u):''),N(b.os)],['To Purchase'+(N(b.pur)?qs(b.purq,b.u):''),N(b.pur)],...(g<0?[]:[['To Gross Profit',g]])],[['By Sale'+(N(b.sale)?qs(b.saleq,b.u):''),N(b.sale)],['By Closing Stock'+(N(b.cs)?qs(b.csq,b.u):''),N(b.cs)],...(g<0?[['By Gross Loss',-g]]:[])])}});
 const pl=!o.T0?pln:[...trb,
  {t:[],h:H,rows:tf([...(gl?[['To Gross Loss b/f',-o.gp]]:[]),...pick('exp','To '),...(o.dep?[['To Depreciation',o.dep]]:[]),...(o.np>=0?[["To Net Profit Transfer to Prop's Cap. A/c",o.np]]:[])],
   [...(gl?[]:[['By Gross Profit b/f',o.gp]]),...pick('oi','By '),...(o.np<0?[["By Net Loss Transfer to Prop's Cap. A/c",-o.np]]:[])])}];
 const pk=(r,p)=>r.filter(x=>N(x.v)).map(x=>[p+(x.n||''),N(x.v)]);
 const cap=o.cps.map((x,i)=>({t:[...(i?[]:T),'CAPITAL ACCOUNT FOR THE A.Y '+D.ay+(NC>1?' ('+N(x.c.pct)+'%)':''),(x.c.prop||'').toUpperCase(),'ANNEXURE : '+String.fromCharCode(65+i)+' :'],h:H,
  rows:tf([...pk(x.c.dr,'To '),...(x.sh<0?[['To Net Loss',-x.sh]]:[]),['To Closing Balance',x.cl]],[['By Balance b/f',N(x.c.ob)],...pk(x.c.add,'By '),...(x.sh>=0?[['By Net Profit',x.sh]]:[])])}));
 ORD.forEach(a=>{const ttl=n=>[`ANNEXURE : ${n} : List Of ${a.t==='stk'?'Closing Stock':a.t==='an'?a.h:(a.x.n||'Schedule')} As On ${dt}`];
  if(a.t==='stk')cap.push({t:ttl(LT.STK),w:2,h:['Particulars','Amount(Rs)'],rows:[...D.tb.filter(b=>N(b.cs)).map((b,i)=>[`${i+1}. ${b.n||'Stock in Hand'}${qs(b.csq,b.u)}`,N(b.cs)]),['Total',o.cs,'','',1]]});
  else if(a.t==='an')cap.push({t:ttl(LT[a.k]),w:2,h:['Particulars','Amount(Rs)'],rows:[...D.L[a.k].filter(x=>N(x.v)).map((x,i)=>[`${i+1}. ${x.n}`,N(x.v)]),['Total',sum(a.k),'','',1]]});
  else cap.push({t:ttl(XL[a.x.id]),w:2,h:['Particulars','Amount(Rs)'],rows:[...a.x.rows.filter(r=>N(r.v)).map((r,i)=>[`${i+1}. ${r.n}`,N(r.v)]),['Total',xsd(a.x),'','',1]]})});
 o.fa.forEach(x=>cap.push({t:[`${x.d.n||'Fixed Asset'} Account as on ${dt}`],h:H,
  rows:tf([['To Opening Balance',N(x.d.o)],...(N(x.d.a1)?[['To Addition (more than 6 months)',N(x.d.a1)]]:[]),...(N(x.d.a2)?[['To Addition (less than 6 months)',N(x.d.a2)]]:[])],
   [[`By Depreciation @ ${N(x.d.r)}%`,x.p],...(N(x.d.d)?[['By Deletion',N(x.d.d)]]:[]),['By Closing Balance',x.c]])}));
 return{bs,pl,cap,o}}
const cell=(l,a)=>`<td${a==null&&l?' style="font-weight:700"':''}>${esc(l)}</td><td class="n">${a==null||a===''?'':fmt(a)}</td>`;
const html=bl=>bl.map(b=>`<div class="card">${b.t.filter(Boolean).map(x=>`<div class="c">${esc(x)}</div>`).join('')}<table>${b.h?'<tr>'+b.h.map((x,i)=>`<th${i%2?' class="n"':''}>${esc(x)}</th>`).join('')+'</tr>':''}${b.rows.map(r=>`<tr${r[4]?' class="b"':''}>${cell(r[0],r[1])}${b.w===2?'':cell(r[2],r[3])}</tr>`).join('')}</table></div>`).join('');
function refresh(){const B=blocks(),df=B.o.tl-B.o.ta,ok=Math.abs(df)<.005;liveAuto(B.o);
 document.getElementById('bs').innerHTML=html(B.bs)+caHtml()+`<div class="chk${ok?'':' bad'}">${ok?'The Balance Sheet is balanced.':'Not balanced: difference (Liabilities − Assets) '+fmt(df)}</div>`;
 document.getElementById('pl').innerHTML=html(B.pl)+caHtml();document.getElementById('cap').innerHTML=html(B.cap)+qtHtml()}
const TBC=()=>`<div class="card"><h3>Trading A/c blocks (each block gets its own Trading A/c. Second line of each block = Unit and Quantity)</h3><table style="min-width:700px"><tr><th>Block name</th><th>Opening Stock</th><th>Purchase</th><th>Sale</th><th>Closing Stock</th><th></th></tr>${D.tb.map((b,i)=>`<tr><td><input data-b="${i}" data-f="n" placeholder="abc" value="${esc(b.n)}"></td>${['os','pur','sale','cs'].map(f=>`<td><input type="number" step="0.01" data-b="${i}" data-f="${f}" value="${esc(b[f])}"></td>`).join('')}<td class="nt"><button class="sm o" data-bdel="${i}" aria-label="Delete block">×</button></td></tr><tr><td><select data-b="${i}" data-f="u" aria-label="Unit">${unitOpts(b.u)}</select></td>${['osq','purq','saleq','csq'].map(f=>`<td><input type="number" step="0.001" placeholder="Qty" aria-label="Quantity" data-b="${i}" data-f="${f}" value="${esc(b[f])}"></td>`).join('')}<td></td></tr>`).join('')}<tr><td colspan="6"><button class="sm o" data-badd="1">+ Add block</button></td></tr></table></div>`;
const xOpts=()=>`<option value="L">Equity &amp; Liabilities (like Capital / Loans)</option><option value="A">Assets (like Loans &amp; Advances / Debtors)</option>`+D.xc.map(c=>`<option value="${esc(c.id)}">Under: ${esc(c.n)} (${c.side==='L'?'Liabilities':'Assets'})</option>`).join('');
const xAddCards=()=>`<div class="card" style="padding:10px"><b>Add a new schedule</b><div class="meta" style="margin:8px 0"><div><label>Schedule name</label><input id="ns_t" placeholder="abc"></div><div><label>Show under</label><select id="ns_w">${xOpts()}</select></div></div><button data-xnew="1">+ Add schedule</button></div><div class="card" style="padding:10px"><b>Add a new section (new liability / asset heading)</b><div class="meta" style="margin:8px 0"><div><label>Section name</label><input id="ns_sec" placeholder="abc"></div><div><label>Side</label><select id="ns_sd"><option value="L">Liabilities</option><option value="A">Assets</option></select></div></div><button data-xsec="1">+ Add section</button>${D.xc.map((c,i)=>` <button class="sm o" data-xsecdel="${i}" aria-label="Delete section">× ${esc(c.n)}</button>`).join('')}</div>`;
const xCards=()=>D.xs.map((x,xi)=>`<div class="card"><h3 style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input data-xs="${xi}" data-f="name" value="${esc(x.n)}" placeholder="abc" style="flex:1;min-width:160px;font-weight:600"><span style="font-weight:400;color:var(--mut);font-size:12px">(${xside(x)==='L'?'Liabilities':'Assets'} side)</span><button class="sm o" data-xsdel="${xi}" aria-label="Delete schedule">× Delete schedule</button></h3><table>${x.rows.map((r,i)=>`<tr><td><input data-xs="${xi}" data-xi="${i}" data-f="n" placeholder="Particulars" value="${esc(r.n)}"></td><td class="v"><input type="number" step="0.01" data-xs="${xi}" data-xi="${i}" data-f="v" value="${esc(r.v)}"></td><td class="nt"><button class="sm o" data-xrdel="${xi}|${i}" aria-label="Delete row">×</button></td></tr>`).join('')}<tr><td colspan="3"><button class="sm o" data-xradd="${xi}">+ Add row</button></td></tr></table></div>`).join('');
function renderIn(){const mi=(m,l,t)=>`<div><label>${l}</label><input data-m="${m}" ${t?'':'type="number" step="0.01" '}value="${esc(D[m])}"></div>`;

<script>
/* Interface used by the desktop shell: Save / Open, auto-save, checks, PDF. Shared helpers are in shared/bsapi-common.html */
(function(){
 const fnEl=document.getElementById('fn');
 window.bsApi={
  fmt:'a',
  firm(){return String(D.firm||'')},
  logo(){return String(D.logo||'')},
  setLogo(u){D.logo=String(u||'')},
  printDoc(){return bsPrintDoc([/^Balance Sheet$/,/^Trading/,/^Capital/])},
  get(){const o=JSON.parse(JSON.stringify(D));o._app='BalanceSheetAnnexure';o._fmt='a';o._fn=fnEl.value||'';return o},
  name(){return bsSafe(fnEl.value)||('Balance_Sheet_Data_'+String(D.d||'').replace(/\W/g,'-'))},
  load(o,fname,silent,done){
   try{
    if(!o||!o.L||!o.fa||!o.tb)throw new Error('This is not a saved Annexure-format data file.');
    const go=()=>{D=migr(o);document.querySelectorAll('.meta [data-m]').forEach(i=>i.value=D[i.dataset.m]);fnEl.value=o._fn||String(fname||'').replace(/\.(json|bsdata)$/i,'');renderIn();refresh();if(done)done()};
    if(silent)go();else ask('Load this data? Current data on screen will be replaced.',go);
   }catch(x){alert('Could not load this file: '+(x&&x.message?x.message:x))}
  },
  totals(){try{const B=blocks();return[{l:B.o.tl,a:B.o.ta}]}catch(e){return[]}},
  check(){
   const r=[];
   try{const B=blocks(),df=B.o.tl-B.o.ta;if(!(Math.abs(df)<.005))r.push({lv:'e',t:'Balance Sheet is not balanced: difference (Liabilities - Assets) '+fmt(df)})}catch(e){}
   try{const t=D.caps.reduce((x,y)=>x+N(y.pct),0);if(Math.abs(t-100)>=.005)r.push({lv:'w',t:'Capital profit-sharing total is '+t+'% (should be 100%)'})}catch(e){}
   if(!String(D.firm||'').trim())r.push({lv:'w',t:'Firm name is empty'});
   if(!bsOkDate(D.d))r.push({lv:'w',t:'Balance Sheet date is missing or not in dd.mm.yyyy format'});
   return r
  }
 };
})();
</script>
