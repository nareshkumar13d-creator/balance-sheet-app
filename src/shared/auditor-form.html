<details class="sigbox" style="margin:0 0 12px;border:1px solid var(--line);border-radius:6px;padding:8px 12px"><summary style="cursor:pointer;font-weight:600">Auditor / Signature details (shown at the end of the Balance Sheet)</summary>
<div class="meta" style="margin-top:10px">
<div><label>Show signature block</label><select data-m="show"><option value="Y">Yes</option><option value="N">No</option></select></div>
<div><label>CA / Auditor firm name</label><input data-m="caFirm" placeholder="e.g. ABC &amp; Associates"></div>
<div><label>Firm type</label><input data-m="caType" value="Chartered Accountants"></div>
<div><label>Firm Reg. No. (FRN) – optional</label><input data-m="caFrn" placeholder="e.g. 123456N"></div>
<div><label>Partner / Proprietor name</label><input data-m="caName" placeholder="e.g. ABC"></div>
<div><label>Designation</label><input data-m="caDesig" value="Partner"></div>
<div><label>Membership No. – optional</label><input data-m="caNo" placeholder="e.g. 123456"></div>
<div><label>UDIN – optional</label><input data-m="caUdin" placeholder="e.g. 26123456ABCDEFGH12"></div>
<div><label>Place</label><input data-m="place" placeholder="e.g. ABC"></div>
<div><label>Date of signing (dd.mm.yyyy)</label><input data-m="dsign" placeholder="dd.mm.yyyy" maxlength="10" inputmode="numeric"></div>
<div><label>Signature text (blank = leave space)</label><input data-m="sg" value="sd/-"></div>
<div><label>Firm signatory designation</label><input data-m="sg1" value="Prop."></div>
</div></details>
