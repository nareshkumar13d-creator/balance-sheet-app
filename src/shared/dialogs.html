<script>(function(){function box(msg,btns){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';const c=document.createElement('div');c.style.cssText='background:var(--card,#fff);color:var(--ink,#1d2a26);border:1px solid var(--line,#d5dbd6);border-radius:8px;padding:18px;max-width:420px;width:90%';const p=document.createElement('p');p.style.cssText='margin:0 0 14px;white-space:pre-line';p.textContent=msg;const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;justify-content:flex-end';btns.forEach(([t,fn,o])=>{const b=document.createElement('button');b.textContent=t;if(o)b.className='o';b.onclick=()=>{ov.remove();if(fn)fn()};r.appendChild(b)});c.append(p,r);ov.appendChild(c);document.body.appendChild(ov);r.lastChild.focus()}
window.ask=(m,y)=>box(m,[['Cancel',0,1],['OK',y]]);window.alert=m=>box(String(m),[['OK']])})();</script>
