<script>
/* Save data / Load data in a normal browser: a .json file, built from window.bsApi (the desktop app replaces this with native windows) */
(function(){
 document.getElementById('sv').onclick=()=>{
  try{
   const name=bsApi.name()+'.json',a=document.createElement('a');
   a.href=URL.createObjectURL(new Blob([JSON.stringify(bsApi.get())],{type:'application/json'}));a.download=name;
   document.body.appendChild(a);a.click();
   setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  }catch(e){alert('Could not save data: '+(e&&e.message?e.message:e))}
 };
 document.getElementById('ld').onclick=()=>document.getElementById('ldf').click();
 document.getElementById('ldf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{bsApi.load(JSON.parse(r.result),f.name,false)}catch(x){alert('Could not load this file: '+(x&&x.message?x.message:x))}};
  r.readAsText(f);e.target.value='';
 };
})();
</script>
