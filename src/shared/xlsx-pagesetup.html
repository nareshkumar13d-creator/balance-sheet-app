<script>
/* ---------- Print-ready Excel: portrait A4/Letter fit-to-width, Depreciation & Quantity landscape ---------- */
function pageSetupXml(x,land){
 x=x.replace(/<pageMargins[^>]*\/>/g,'').replace(/<pageSetup[^>]*\/>/g,'').replace(/<printOptions[^>]*\/>/g,'').replace(/<headerFooter[\s\S]*?<\/headerFooter>/g,'');
 if(/<sheetPr[^>]*\/>/.test(x))x=x.replace(/<sheetPr([^>]*)\/>/,'<sheetPr$1><pageSetUpPr fitToPage="1"/></sheetPr>');
 else if(/<sheetPr[\s>]/.test(x)){if(/<pageSetUpPr/.test(x))x=x.replace(/<pageSetUpPr[^>]*\/>/,'<pageSetUpPr fitToPage="1"/>');else x=x.replace(/<\/sheetPr>/,'<pageSetUpPr fitToPage="1"/></sheetPr>')}
 else x=x.replace(/(<worksheet[^>]*>)/,'$1<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
 const tail='<printOptions horizontalCentered="1"/><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.55" header="0.25" footer="0.25"/><pageSetup paperSize="9" orientation="'+(land?'landscape':'portrait')+'" fitToWidth="1" fitToHeight="0"/>';
 const m=x.search(/<(rowBreaks|colBreaks|customProperties|cellWatches|ignoredErrors|smartTags|drawing|legacyDrawing|legacyDrawingHF|picture|oleObjects|controls|webPublishItems|tableParts|extLst)[\s>\/]/);
 return m>=0?x.slice(0,m)+tail+x.slice(m):x.replace(/<\/worksheet>/,tail+'</worksheet>')}
/* Optional firm logo: a picture is added to the top-left of every sheet except the data sheet "AppData" */
async function addLogoToXlsx(z,sheetNames,dataUrl){
 const m=/^data:image\/(png|jpeg);base64,(.+)$/.exec(dataUrl||'');if(!m)return;
 const ext=m[1]==='jpeg'?'jpeg':'png';
 const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=dataUrl});
 if(!img||!img.naturalWidth)return;
 const H=Math.round(46*9525),W=Math.round(H*img.naturalWidth/img.naturalHeight);   // 46 pixels high
 z.file('xl/media/firmlogo.'+ext,m[2],{base64:true});
 let ct=await z.file('[Content_Types].xml').async('string');
 if(!new RegExp('Extension="'+ext+'"').test(ct))ct=ct.replace('<Override','<Default Extension="'+ext+'" ContentType="image/'+ext+'"/><Override');
 const NS_R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
 for(let i=0;i<sheetNames.length;i++){
  if(sheetNames[i]==='AppData')continue;
  const n=i+1,sp='xl/worksheets/sheet'+n+'.xml',sf=z.file(sp);if(!sf)continue;
  let x=await sf.async('string');if(/<drawing[\s>\/]/.test(x))continue;
  if(!/<worksheet[^>]*xmlns:r=/.test(x))x=x.replace(/<worksheet/,'<worksheet xmlns:r="'+NS_R+'"');
  const tag='<drawing r:id="rIdLogo1"/>',at=x.search(/<(legacyDrawing|legacyDrawingHF|picture|oleObjects|controls|webPublishItems|tableParts|extLst)[\s>\/]/);
  x=at>=0?x.slice(0,at)+tag+x.slice(at):x.replace(/<\/worksheet>/,tag+'</worksheet>');
  z.file(sp,x);
  const rp='xl/worksheets/_rels/sheet'+n+'.xml.rels',rel='<Relationship Id="rIdLogo1" Type="'+NS_R+'/drawing" Target="../drawings/drawing'+n+'.xml"/>',rf=z.file(rp);
  if(rf){const r=await rf.async('string');z.file(rp,r.replace('</Relationships>',rel+'</Relationships>'))}
  else z.file(rp,'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rel+'</Relationships>');
  z.file('xl/drawings/drawing'+n+'.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>57150</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>38100</xdr:rowOff></xdr:from><xdr:ext cx="'+W+'" cy="'+H+'"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Firm logo"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="'+NS_R+'" r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+W+'" cy="'+H+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>');
  z.file('xl/drawings/_rels/drawing'+n+'.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+NS_R+'/image" Target="../media/firmlogo.'+ext+'"/></Relationships>');
  ct=ct.replace('</Types>','<Override PartName="/xl/drawings/drawing'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
 }
 z.file('[Content_Types].xml',ct);
}
function saveXlsx(wb,fname){
 if(typeof JSZip==='undefined'){XLSX.writeFile(wb,fname);return}
 const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 JSZip.loadAsync(out).then(z=>{const jobs=[];
  wb.SheetNames.forEach((nm,i)=>{if(nm==='AppData')return;const p='xl/worksheets/sheet'+(i+1)+'.xml',f=z.file(p);if(!f)return;
   jobs.push(f.async('string').then(x=>{z.file(p,pageSetupXml(x,/deprec|quantity/i.test(nm)))}))});
  return Promise.all(jobs).then(()=>{const lg=window.bsApi&&bsApi.logo?bsApi.logo():'';return lg?addLogoToXlsx(z,wb.SheetNames,lg).catch(e=>console.error('logo skipped',e)):null}).then(()=>z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'}))})
 .then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)})
 .catch(e=>{console.error(e);XLSX.writeFile(wb,fname)})}
</script>
