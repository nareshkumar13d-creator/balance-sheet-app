name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test          # opens the app in Edge and checks totals, tally and old data files
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: BalanceSheet_Setup
          path: dist/*.exe
