name: Release Windows installer

on:
  push:
    tags:
      - 'v*'          # jaise v1.0.0, v1.0.1
  workflow_dispatch:   # manual test run (release nahi banayega, sirf artifact)

permissions:
  contents: write      # Release banane ke liye zaroori (iske bina 403 error aata hai)

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check app/index.html is up to date with src/
        run: node build.js --check

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VER - fix package.json and push the tag again"
            exit 1
          fi

      - name: Build installer
        run: npm run dist:release
        env:
          # Code signing is optional. Add repository secrets CSC_LINK (base64 of your .pfx) and
          # CSC_KEY_PASSWORD to sign the installer. Without them the installer is built unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Check installer exists
        shell: bash
        run: |
          ls -la dist
          test -f dist/BalanceSheet_Setup.exe
          test -f dist/latest.yml || echo "::warning::dist/latest.yml missing - auto-update will not work for this release"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BalanceSheet_Setup.exe
            dist/BalanceSheet_Setup.exe.blockmap
            dist/latest.yml
          generate_release_notes: true

      - name: Keep a copy as artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: BalanceSheet_Setup
          path: dist/BalanceSheet_Setup.exe
